<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SproutMill · ตัวอย่างฉากด่าน 1</title>
<link rel="stylesheet" href="story.css"><style>
body{margin:0;background:#202722;font-family:Tahoma,sans-serif}#cs378{position:fixed;inset:0;display:flex;flex-direction:column;color:#3a2814}#cs378 .stage{flex:1;min-height:0;position:relative;overflow:hidden}#cs378 .pt{position:absolute}#cs378 .btn{position:absolute;top:calc(10px + env(safe-area-inset-top));z-index:2;background:#fbf3df;border:2px solid #8a5d33;padding:4px 12px;font-weight:bold;color:#3a2814;font-size:14px}#cs378 .skip{right:10px}#cs378 .back{left:10px}#cs378 .dlg{flex:none;position:relative}#cs378 .nm{position:absolute;font-weight:bold;color:#fff4d8}#cs378 .nx{position:absolute}#cs378 .tx.nar{font-style:italic;color:#6b5230}#cs378 .go{display:block;width:100%;background:#7bbf5a;border:3px solid #3b6d11;border-radius:5px;padding:6px;font-size:17px;font-weight:bold;color:#173a05}
</style>
<div id="cs378"><div class="stage"><img class="pt pl" alt=""><img class="pt pr" alt=""><button class="btn back">← กลับ</button><button class="btn skip">ข้าม ⏭</button></div><div class="dlg"><div class="nm"></div><div class="tx"></div><div class="nx">▶</div></div></div>
<script src="story.js"></script><script>
const sizes={phone:[390,844],ipad:[820,1180],desktop:[1440,900],landscape:[844,390]};const device=new URLSearchParams(location.search).get('device');
if(sizes[device]){document.querySelector('#cs378').remove();const [w,h]=sizes[device];document.body.style.cssText='margin:0;padding:25px;color:white';const link=document.createElement('p');link.textContent=device+' · '+w+' × '+h;document.body.appendChild(link);const frame=document.createElement('iframe');frame.src='preview.html';frame.style.cssText='display:block;border:0;width:'+w+'px;height:'+h+'px;max-width:none';document.body.appendChild(frame)}
else{const root=document.querySelector('#cs378'), art=initChapterOneStoryArt(root), tx=root.querySelector('.tx'),nm=root.querySelector('.nm');let step=0;const lines=[['N','ตอนเย็น กองทหารเดินทัพเข้ามาในหมู่บ้านชานเมืองพร้อมรถเสบียงที่ว่างเปล่า'],['L','ชาวบ้านทุกคน ฟังทางนี้! ตอนนี้ค่ายทหารขาดเสบียง ต้องใช้ข้าวสาลีกับอ้อยด่วน'],['F','มีครับท่าน แต่ปีนี้ฝนแล้ง ผลผลิตไม่ค่อยดี'],['W','ผมจะทำรถเข็นเพิ่มให้ ขนได้เร็วขึ้นครับ'],['G','']];function show(){const [k,text]=lines[step];art.show({k});nm.textContent=k==='L'?'เก็ตต์':k==='F'?'ชาวนา':'คนตัดไม้';nm.style.display=k==='N'||k==='G'?'none':'';tx.classList.toggle('nar',k==='N');tx.textContent=text;root.querySelector('.nx').style.display=k==='G'?'none':'';if(k==='G')tx.innerHTML='<div class="gl"><b>🎯 เป้าหมายด่าน 1 · ชานเมือง</b><div>ขายข้าวสาลี 30 ชิ้น</div><div>ขายอ้อย 30 ชิ้น</div><div>⏱ เวลา 15 นาที · เงินเริ่มต้น $150,000</div></div><button class="go">▶ เริ่มด่าน</button>';}
root.addEventListener('click',e=>{if(e.target.closest('.btn')||e.target.closest('.go'))return;if(step<lines.length-1){step++;show()}});root.querySelector('.skip').onclick=()=>{step=lines.length-1;show()};root.querySelector('.back').onclick=()=>{step=0;show()};show();}
</script></html>
